<html lang="en">
<head>

  <style>
:root{--bg:#060d1f;--bg2:#0a1628;--card:rgba(10,22,40,.88);--cyan:#00d4ff;--cyan-dim:#00a8cc;--cyan-glow:rgba(0,212,255,.14);--cyan-glow2:rgba(0,212,255,.35);--green:#00ff88;--green-dim:#00cc6a;--green-glow:rgba(0,255,136,.14);--red:#ff3366;--red-dim:#cc2952;--red-glow:rgba(255,51,102,.14);--yellow:#ffbb00;--t1:#e8f4fd;--t2:#7fa8c9;--t3:#4a6a8a;--border:rgba(0,212,255,.12);--border2:rgba(0,212,255,.35);--r:12px;--font:'Inter',system-ui,sans-serif;--display:'Orbitron',monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
#root{position:relative;z-index:1;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:3px;}
.gradient-text{background:linear-gradient(135deg,var(--cyan),#0080ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(20px);transition:all .25s;}
.card:hover{border-color:var(--border2);box-shadow:0 0 30px var(--cyan-glow);}
.card-red{border-color:rgba(255,51,102,.35)!important;box-shadow:0 0 20px var(--red-glow)!important;}
.card-green{border-color:rgba(0,255,136,.35)!important;box-shadow:0 0 20px var(--green-glow)!important;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;background:linear-gradient(135deg,var(--cyan),#0080ff);color:var(--bg);font-weight:700;font-size:.93rem;border:none;border-radius:var(--r);cursor:pointer;transition:all .25s;font-family:var(--font);white-space:nowrap;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--cyan-glow2);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-o{background:transparent;color:var(--cyan);border:1px solid var(--border2);font-weight:600;}
.btn-o:hover{background:var(--cyan-glow);box-shadow:0 0 14px var(--cyan-glow);transform:none;}
.btn-d{background:transparent;color:var(--red);border:1px solid rgba(255,51,102,.3);font-weight:600;}
.btn-d:hover{background:var(--red-glow);border-color:var(--red);transform:none;box-shadow:none;}
.inp{width:100%;padding:14px 17px;background:rgba(6,13,31,.85);border:1px solid var(--border);border-radius:var(--r);color:var(--t1);font-family:var(--font);font-size:1rem;transition:all .25s;outline:none;}
.inp::placeholder{color:var(--t3);}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow);}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px var(--red-glow);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:100px;font-size:.76rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.b-low{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.3);}
.b-med{background:rgba(255,187,0,.1);color:var(--yellow);border:1px solid rgba(255,187,0,.3);}
.b-high{background:rgba(255,51,102,.1);color:var(--red);border:1px solid rgba(255,51,102,.3);}
.b-legit{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.3);font-size:.88rem;padding:7px 16px;}
.b-fake{background:rgba(255,51,102,.1);color:var(--red);border:1px solid rgba(255,51,102,.3);font-size:.88rem;padding:7px 16px;}
.pill{display:inline-flex;padding:5px 13px;background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.2);border-radius:100px;font-size:.78rem;color:var(--cyan);font-weight:500;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.au{animation:fadeUp .5s ease forwards;}
.d1{animation-delay:.1s;opacity:0;}.d2{animation-delay:.2s;opacity:0;}.d3{animation-delay:.3s;opacity:0;}.d4{animation-delay:.4s;opacity:0;}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(0,212,255,.15);border-top-color:var(--cyan);animation:spin .8s linear infinite;flex-shrink:0;}
.spin-sm{width:17px;height:17px;border-width:2px;}
.con{max-width:1200px;margin:0 auto;padding:0 24px;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr;}.con{padding:0 14px;}}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:66px;background:rgba(6,13,31,.93);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,212,255,.1);display:flex;align-items:center;padding:0 24px;transition:all .3s;}
.nav-in{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.logo-ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#0080ff);display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 0 20px rgba(0,212,255,.4);}
.nav-links{display:flex;gap:4px;align-items:center;}
.nl{padding:7px 15px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.87rem;color:var(--t2);border:1px solid transparent;background:none;font-family:var(--font);transition:all .2s;}
.nl:hover{color:var(--cyan);}
.nl.act{color:var(--cyan);background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.25);}
.nav-cta{margin-left:12px;padding:8px 17px;background:linear-gradient(135deg,var(--cyan),#0080ff);color:var(--bg);font-weight:700;font-size:.84rem;border-radius:8px;cursor:pointer;border:none;font-family:var(--font);transition:all .2s;}
.nav-cta:hover{box-shadow:0 0 24px rgba(0,212,255,.45);}
.ham{display:none;background:none;border:1px solid rgba(0,212,255,.3);color:var(--cyan);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:1.1rem;font-family:var(--font);}
@media(max-width:768px){.nav-links{display:none!important;}.ham{display:flex!important;}}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:12px 15px;text-align:left;font-size:.73rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border);}
.tbl td{padding:12px 15px;font-size:.86rem;border-bottom:1px solid rgba(0,212,255,.04);color:var(--t2);vertical-align:middle;}
.tbl tr:hover td{background:rgba(0,212,255,.025);color:var(--t1);}
.bar-track{width:100%;height:10px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;transition:width 1s ease;}
.bar-legit{background:linear-gradient(90deg,var(--green-dim),var(--green));box-shadow:0 0 10px var(--green-glow);}
.bar-fake{background:linear-gradient(90deg,var(--red-dim),var(--red));box-shadow:0 0 10px var(--red-glow);}
.reason{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:7px;font-size:.87rem;}
.r-danger{background:rgba(255,51,102,.05);border:1px solid rgba(255,51,102,.12);color:#f0a0b0;}
.r-safe{background:rgba(0,255,136,.05);border:1px solid rgba(0,255,136,.12);color:#80f0b0;}
.feat{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:7px;font-size:.78rem;}
.feat .fn{color:var(--t3);}.feat .fv{font-weight:700;color:var(--cyan);}
.toast{position:fixed;bottom:26px;right:26px;z-index:9999;padding:12px 20px;border-radius:var(--r);font-weight:600;font-size:.86rem;animation:fadeUp .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4);}
.toast.ok{background:rgba(0,255,136,.12);border:1px solid var(--green);color:var(--green);}
.toast.err{background:rgba(255,51,102,.12);border:1px solid var(--red);color:var(--red);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;}
.page{padding-top:90px;padding-bottom:80px;min-height:100vh;}
.orb{position:absolute;border-radius:50%;pointer-events:none;}
.sec-hdr{text-align:center;margin-bottom:50px;}
.sec-hdr h2{font-family:var(--display);font-size:2rem;font-weight:700;margin-bottom:10px;}
.sec-hdr p{color:var(--t2);max-width:520px;margin:0 auto;}
  </style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;"><div style="width:40px;height:40px;border-radius:50%;border:3px solid rgba(0,212,255,.15);border-top-color:#00d4ff;animation:spin .8s linear infinite;"></div><p style="color:#7fa8c9;font-family:sans-serif;">Loading PhishGuard AI…</p></div></div>

<script type="text/babel">
/* PhishGuard AI — React SPA via CDN */
const { useState, useEffect, useCallback } = React;

/* ── Hash Router ── */
function useHash() {
  const [hash, setHash] = useState(window.location.hash.replace('#','') || '/');
  useEffect(() => {
    const fn = () => setHash(window.location.hash.replace('#','') || '/');
    window.addEventListener('hashchange', fn);
    return () => window.removeEventListener('hashchange', fn);
  }, []);
  const go = p => { window.location.hash = p; };
  return [hash, go];
}

/* ── API ── */
const BASE = 'http://localhost:5000/api';
const predict   = url => axios.post(BASE+'/predict', {url});
const getHist   = ()  => axios.get(BASE+'/history');
const delOne    = id  => axios.delete(BASE+'/history/'+id);
const delAll    = ()  => axios.delete(BASE+'/history');
const modelInfo = ()  => axios.get(BASE+'/model-info');

/* ── RiskBadge ── */
const RiskBadge = ({level}) => {
  const m = {Low:['b-low','✓','Low Risk'],Medium:['b-med','⚠','Medium Risk'],High:['b-high','✕','High Risk']};
  const [cls,ic,lbl] = m[level]||m.High;
  return <span className={`badge ${cls}`}>{ic} {lbl}</span>;
};

/* ── ConfidenceBar ── */
const ConfidenceBar = ({confidence, prediction}) => {
  const [w,setW] = useState(0);
  const fake = prediction==='Fake';
  useEffect(()=>{ const t=setTimeout(()=>setW(confidence),100); return ()=>clearTimeout(t); },[confidence]);
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
        <span style={{fontSize:'.75rem',color:'var(--t3)',letterSpacing:1,textTransform:'uppercase'}}>Confidence</span>
        <span style={{fontFamily:'Orbitron,monospace',fontWeight:700,fontSize:'1.1rem',color:fake?'var(--red)':'var(--green)'}}>{confidence.toFixed(1)}%</span>
      </div>
      <div className="bar-track"><div className={`bar-fill ${fake?'bar-fake':'bar-legit'}`} style={{width:w+'%'}}/></div>
    </div>
  );
};

/* ── ResultCard ── */
const FLABELS={url_length:'URL Length',domain_length:'Domain Length',num_dots:'Dot Count',num_hyphens:'Hyphen Count',num_digits:'Digit Count',num_slashes:'Slash Count',num_subdomains:'Subdomains',has_https:'HTTPS',has_ip:'IP Address',has_at:'"@" Symbol',has_hyphen_domain:'Domain Hyphen',suspicious_keyword_count:'Suspicious Keywords',prefix_suffix:'Prefix-Suffix'};
const BOOL_FEATS = ['has_https','has_ip','has_at','has_hyphen_domain','prefix_suffix'];
const ResultCard = ({result}) => {
  const [showF,setShowF] = useState(false);
  if(!result) return null;
  const {prediction,confidence,risk,reasons,features,model_used} = result;
  const fake = prediction==='Fake';
  return (
    <div className={`card au ${fake?'card-red':'card-green'}`} style={{overflow:'hidden',marginTop:0}}>
      <div style={{padding:'24px 28px',background:fake?'linear-gradient(135deg,rgba(255,51,102,.08),rgba(255,51,102,.02))':'linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,255,136,.02))',borderBottom:'1px solid rgba(255,255,255,.05)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <div style={{width:58,height:58,borderRadius:'50%',fontSize:'1.6rem',background:fake?'radial-gradient(rgba(255,51,102,.2),rgba(255,51,102,.05))':'radial-gradient(rgba(0,255,136,.2),rgba(0,255,136,.05))',border:`2px solid ${fake?'rgba(255,51,102,.5)':'rgba(0,255,136,.5)'}`,display:'flex',alignItems:'center',justifyContent:'center'}}>{fake?'⚠':'✓'}</div>
          <div>
            <div style={{fontFamily:'Orbitron,monospace',fontSize:'1.35rem',fontWeight:700,color:fake?'var(--red)':'var(--green)',marginBottom:5}}>{fake?'FAKE WEBSITE':'LEGITIMATE WEBSITE'}</div>
            <span className={fake?'badge b-fake':'badge b-legit'}>{prediction}</span>
          </div>
        </div>
        <RiskBadge level={risk}/>
      </div>
      <div style={{padding:'24px 28px'}}>
        <div style={{marginBottom:26}}><ConfidenceBar confidence={confidence} prediction={prediction}/></div>
        <div style={{fontSize:'.78rem',color:'var(--t3)',marginBottom:20}}>🤖 Model: <strong style={{color:'var(--cyan)'}}>{model_used}</strong></div>
        <div style={{marginBottom:22}}>
          <div style={{fontSize:'.73rem',fontWeight:700,letterSpacing:2,textTransform:'uppercase',color:'var(--t3)',marginBottom:10}}>{fake?'⚡ Risk Factors':'✓ Safety Analysis'}</div>
          {reasons.map((r,i)=><div key={i} className={`reason ${fake?'r-danger':'r-safe'}`}><span style={{flexShrink:0}}>{fake?'⚡':'✓'}</span>{r}</div>)}
        </div>
        <button className="btn btn-o" style={{width:'100%',justifyContent:'center'}} onClick={()=>setShowF(!showF)}>{showF?'▲ Hide Features':'▼ View Extracted Features'}</button>
        {showF && features && (
          <div style={{marginTop:16,display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(205px,1fr))',gap:7}}>
            {Object.entries(features).map(([k,v])=>(
              <div key={k} className="feat">
                <span className="fn">{FLABELS[k]||k}</span>
                <span className="fv" style={{color:(k==='has_ip'||k==='has_at')&&v===1?'var(--red)':k==='has_https'&&v===1?'var(--green)':'var(--cyan)'}}>
                  {BOOL_FEATS.includes(k)?v===1?'Yes':'No':v}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

/* ── Navbar ── */
const Navbar = ({page,go}) => {
  const [sc,setSc]=useState(false);
  const [open,setOpen]=useState(false);
  useEffect(()=>{const fn=()=>setSc(window.scrollY>20);window.addEventListener('scroll',fn);return()=>window.removeEventListener('scroll',fn);},[]);
  const links=[{p:'/',l:'Home'},{p:'/detect',l:'Detect'},{p:'/history',l:'History'},{p:'/about',l:'About'}];
  return (
    <nav className="nav" style={{background:sc?'rgba(6,13,31,.97)':'rgba(6,13,31,.8)'}}>
      <div className="nav-in">
        <div className="nav-logo" onClick={()=>go('/')}>
          <div className="logo-ic">🛡</div>
          <div>
            <div style={{fontFamily:'Orbitron,monospace',fontWeight:700,fontSize:'.88rem',color:'var(--t1)',letterSpacing:1}}>PHISHGUARD <span style={{color:'var(--cyan)'}}>AI</span></div>
            <div style={{fontSize:'.58rem',color:'var(--t3)',letterSpacing:2,textTransform:'uppercase'}}>Fake Website Detector</div>
          </div>
        </div>
        <div className="nav-links">
          {links.map(({p,l})=><button key={p} className={`nl${page===p?' act':''}`} onClick={()=>go(p)}>{l}</button>)}
          <button className="nav-cta" onClick={()=>go('/detect')}>Scan URL →</button>
        </div>
        <button className="ham" onClick={()=>setOpen(!open)}>{open?'✕':'☰'}</button>
      </div>
      {open&&<div style={{background:'rgba(6,13,31,.98)',borderTop:'1px solid rgba(0,212,255,.08)',padding:'12px 24px 20px'}}>
        {links.map(({p,l})=><button key={p} onClick={()=>{go(p);setOpen(false);}} style={{display:'block',width:'100%',textAlign:'left',padding:'12px 0',background:'none',border:'none',borderBottom:'1px solid rgba(0,212,255,.05)',color:page===p?'var(--cyan)':'var(--t2)',fontWeight:600,cursor:'pointer',fontFamily:'var(--font)',fontSize:'.93rem'}}>{l}</button>)}
      </div>}
    </nav>
  );
};

/* ========== PAGE: HOME ========== */
const DEMOS=['https://www.google.com','http://paypal-secure-verify.tk/login','https://github.com','http://192.168.0.1/bank-login'];
const FEATS=[
  {i:'🔍',t:'URL Analysis',d:'13 URL-based features extracted in milliseconds for instant classification'},
  {i:'🤖',t:'AI Prediction',d:'Random Forest model trained on thousands of phishing patterns'},
  {i:'📊',t:'Confidence Score',d:'See exactly how certain the model is about each prediction'},
  {i:'⚡',t:'Explainable AI',d:'Human-readable risk reasons — not just "Fake"'},
  {i:'📋',t:'Scan History',d:'Every scan saved with full results, searchable and deletable'},
  {i:'🛡',t:'Risk Levels',d:'Low, Medium, High risk classification with color coding'},
];
const STATS=[{v:'100%',l:'Dataset Accuracy'},{v:'13',l:'URL Features'},{v:'3',l:'ML Models Compared'},{v:'<2s',l:'Prediction Time'}];

const PageHome = ({go}) => {
  const [url,setUrl]=useState('');
  const [di,setDi]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setDi(i=>(i+1)%DEMOS.length),3000);return()=>clearInterval(t);},[]);
  const submit=e=>{e.preventDefault();if(url.trim()){sessionStorage.setItem('purl',url.trim());go('/detect');}};
  const tryUrl=u=>{sessionStorage.setItem('purl',u);go('/detect');};
  return (
    <div className="page">
      {/* Hero */}
      <section style={{minHeight:'86vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden',padding:'60px 24px'}}>
        <div className="orb" style={{top:'15%',left:'8%',width:360,height:360,background:'radial-gradient(rgba(0,212,255,.055),transparent 70%)'}}/>
        <div className="orb" style={{bottom:'15%',right:'8%',width:300,height:300,background:'radial-gradient(rgba(0,128,255,.055),transparent 70%)'}}/>
        <div style={{maxWidth:820,textAlign:'center',position:'relative'}}>
          <div className="au" style={{display:'inline-flex',alignItems:'center',gap:8,padding:'6px 16px',background:'rgba(0,212,255,.08)',border:'1px solid rgba(0,212,255,.25)',borderRadius:100,marginBottom:26,fontSize:'.76rem',fontWeight:700,color:'var(--cyan)',letterSpacing:1}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'var(--green)',animation:'blink 1.5s ease infinite',display:'inline-block'}}/>
            AI-POWERED CYBERSECURITY TOOL
          </div>
          <h1 className="au d1" style={{fontFamily:'Orbitron,monospace',fontSize:'clamp(1.8rem,5vw,3.4rem)',fontWeight:800,lineHeight:1.15,marginBottom:22}}>
            Detect <span className="gradient-text">Fake Websites</span><br/>Before They Steal Your Data
          </h1>
          <p className="au d2" style={{fontSize:'1.08rem',color:'var(--t2)',maxWidth:550,margin:'0 auto 38px',lineHeight:1.7}}>
            Enter any URL and our AI will analyze it for phishing patterns, suspicious features, and security threats — in under 2 seconds.
          </p>
          <form onSubmit={submit} className="au d3" style={{display:'flex',gap:12,maxWidth:600,margin:'0 auto 16px',flexWrap:'wrap'}}>
            <input id="hero-url" className="inp" type="text" value={url} onChange={e=>setUrl(e.target.value)} placeholder={'Try: '+DEMOS[di]} style={{flex:1,minWidth:200}}/>
            <button type="submit" className="btn" id="hero-btn">🔍 Analyze URL</button>
          </form>
          <div className="au d4" style={{fontSize:'.76rem',color:'var(--t3)'}}>

const PageDetect = () => {
  const [url,setUrl]=useState('');
  const [result,setResult]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');
  useEffect(()=>{
    const pre=sessionStorage.getItem('purl');
    if(pre){sessionStorage.removeItem('purl');setUrl(pre);run(pre);}
  },[]);
  const run = async u => {
    const t=u||url; setError(''); setResult(null);
    if(!t.trim()){setError('Please enter a URL.');return;}
    if(!t.startsWith('http://')&&!t.startsWith('https://')){setError('URL must start with http:// or https://');return;}
    setLoading(true);
    try{const r=await predict(t.trim());setResult(r.data);}
    catch(e){setError(e.response?.data?.error||'Failed to reach backend. Make sure Flask is running on port 5000.');}
    finally{setLoading(false);}
  };

    <div className="page">

          <div className="g2">{TECH.map(({c,i})=>(
            <div key={c} className="card" style={{padding:20}}>
              <h3 style={{fontSize:'.7rem',fontWeight:700,letterSpacing:2,textTransform:'uppercase',color:'var(--cyan)',marginBottom:13}}>{c}</h3>
              {i.map(x=><div key={x} style={{display:'flex',alignItems:'center',gap:9,fontSize:'.87rem',marginBottom:8}}><span style={{color:'var(--green)',fontSize:'.62rem'}}>▶</span>{x}</div>)}
            </div>
          ))}</div>
        </section>
      </div>
    </div>
  );
};

/* ========== APP ROOT ========== */
const App = () => {
  const [page,go]=useHash();
  const pages={'/': <PageHome go={go}/>, '/detect': <PageDetect/>, '/history': <PageHistory/>, '/about': <PageAbout/>};
  return (
    <div>
      <Navbar page={page} go={go}/>
      {pages[page]||<div className="page" style={{textAlign:'center',color:'var(--t3)',paddingTop:130}}>
        <h2 style={{fontFamily:'Orbitron,monospace',marginBottom:12,fontSize:'2rem',color:'var(--cyan)'}}>404</h2>
        <p>Page not found. <button style={{color:'var(--cyan)',background:'none',border:'none',cursor:'pointer',fontWeight:700,fontFamily:'var(--font)'}} onClick={()=>go('/')}>← Go Home</button></p>
      </div>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
